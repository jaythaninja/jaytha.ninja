:root{
  --bg:#000; --ink:#f6efe9; --ink-2:rgba(246,239,233,.72); --ink-3:rgba(246,239,233,.5);
  --orange:#FF4D1A; --teal:#1AADB3; --white:#fff;
  --mono:"JetBrains Mono","IBM Plex Mono",ui-monospace,monospace;
  --left:max(64px,calc((100vw - 1312px)/2));
}
*{box-sizing:border-box;margin:0;padding:0;font-style:normal}
html{background:var(--bg);touch-action:manipulation}   /* round 12: taps toggle typing speed, so no double-tap zoom (pinch zoom + scrolling still work) */
body{background:var(--bg);color:var(--ink);font-family:var(--mono);font-weight:500;-webkit-font-smoothing:antialiased;overflow-x:hidden;position:relative;min-height:100vh;min-height:100svh}   /* round 17: svh = the visible area between safari's bars, so a page that fits never scrolls */
a{color:var(--orange);text-decoration:none;transition:color .15s ease}
a:hover{color:var(--teal)}
::selection{background:var(--teal);color:#021213}
.glows{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 20%,#000 80%,transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 20%,#000 80%,transparent 100%)}   /* round 8: glow fades out so the top + bottom are pure #000 (blends into oled black) */
.glow{position:absolute;border-radius:50%;filter:blur(14px)}
/* round 24 (jay 2026.09.29): orange text (egg line + its falling letters/trails/arrow, "[ notify me ]") is regular 400; teal + white stay 500 */
#rain{position:absolute;left:0;top:0;width:100%;z-index:1;pointer-events:none}
.scan{position:fixed;inset:0;z-index:30;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(235,250,250,.026) 0 1px,rgba(0,0,0,0) 1px 3px);mix-blend-mode:screen;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 20%,#000 80%,transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 20%,#000 80%,transparent 100%)}

.stage{position:relative;z-index:2;min-height:100vh;min-height:100svh;display:flex;align-items:center;padding:clamp(48px,8vh,96px) 0 clamp(56px,9vh,100px)}   /* centered; if the block is taller than the viewport the stage just grows (no clipping) */
.copy{margin-left:var(--left);width:min(60ch,calc(100vw - 48px));font-size:20px;text-shadow:0 0 8px rgba(0,0,0,.8)}
.hello{font-size:21px;line-height:1.4;color:var(--teal)}
.paras{margin-top:26px}
.para{font-size:20px;line-height:1.7;color:var(--white);white-space:pre-line}
.para + .para{margin-top:20px}
@media (min-width:761px){.copy{width:min(70ch,calc(100vw - var(--left) - 24px))}}   /* round 23 (jay 2026.09.29): desktop column wide enough for the longest paragraph */
@media (min-width:940px){.para{white-space:nowrap}}   /* ...and every paragraph sits on one line. 761-939px still wraps; mobile (<=760) unchanged */
.para a{white-space:nowrap}   /* an address/link never breaks mid-way; lines wrap at the "; " separators */
.para .bold{font-weight:700;color:var(--white)}
.para .teal{color:var(--teal)}
/* round 20: inline icons in the copy (the rocket). sized to the text, reserved from the start so nothing reflows, popped in like the ninja */
.para .icon{white-space:nowrap}
.para .icb{position:relative;display:inline-block;height:1.3em;width:1.3em;vertical-align:-.3em}
.para .icb img{display:block;height:100%;width:100%;opacity:0;transform:scale(.4) translateY(6px);transition:opacity .28s ease-out,transform .42s cubic-bezier(.34,1.56,.64,1)}
.para .icb img.in{opacity:1;transform:none}
.para .iscr{position:absolute;left:.35em;top:50%;transform:translateY(-50%);line-height:1}
.sig{margin-top:22px;font-size:20px;line-height:1.5;color:var(--teal)}
.sig .ninja{display:inline-block;height:1.45em;width:1.45em;margin-left:.4em;vertical-align:-.38em;opacity:0;transform:scale(.4) translateY(6px);transition:opacity .28s ease-out,transform .42s cubic-bezier(.34,1.56,.64,1)}
.sig .ninja.in{opacity:1;transform:none}
.cta{margin-top:52px;font-size:20px;line-height:1.5}   /* jay 2026.09.29: one extra blank line after the sign-off */
.prompt{color:var(--white)}
/* round 10: inline signup. prompt types, then the form slides in; the thank-you line types into the same slot (no reflow) */
.signup{display:grid;grid-template-columns:minmax(0,1fr);margin-top:6px}
.signup > *{grid-area:1/1}
.notify{display:flex;min-width:0;align-items:baseline;gap:18px;transition:opacity .45s ease-out,transform .5s cubic-bezier(.22,1,.36,1),visibility 0s}
.js .notify{opacity:0;transform:translateY(6px);visibility:hidden}
.js .notify.in{opacity:1;transform:none;visibility:visible}
.js .notify.gone{opacity:0;transform:translateY(-4px);visibility:hidden;transition:opacity .2s ease-in,transform .2s ease-in,visibility 0s .2s}
.notify input{flex:0 1 23ch;min-width:0;font:inherit;font-size:18px;line-height:1.5;color:var(--white);background:transparent;border:0;border-bottom:1px solid rgba(26,173,179,.55);border-radius:0;padding:4px 0 5px;caret-color:var(--teal);outline:none;-webkit-appearance:none;appearance:none;transition:border-color .2s ease,box-shadow .2s ease}
.notify input::placeholder{color:rgba(246,239,233,.34);opacity:1}
.notify input:hover{border-bottom-color:rgba(26,173,179,.8)}
.notify input:focus{border-bottom-color:var(--teal);box-shadow:0 1px 0 var(--teal),0 10px 18px -12px rgba(26,173,179,.9)}
.notify input:-webkit-autofill{-webkit-text-fill-color:var(--white);-webkit-box-shadow:0 0 0 60px #000 inset;caret-color:var(--teal);transition:background-color 9999s}
.notify button{flex:none;font:inherit;font-size:18px;line-height:1.5;color:var(--orange);background:transparent;border:0;border-radius:6px;padding:4px 6px;margin:0 -6px;cursor:pointer;white-space:nowrap;font-weight:400;transition:color .15s ease,background-color .15s ease}
.notify button:hover,.notify button:focus-visible{color:var(--teal);background:rgba(26,173,179,.08)}
.notify button[disabled]{cursor:default;color:var(--ink-3);background:transparent}
.status{align-self:center;color:var(--teal);font-size:20px;line-height:1.5}
.status:empty{display:none}
/* typing internals: resolved text, scrambling window, and the not-yet-typed text held invisibly so lines never reflow */
.scr{color:#fff;font-weight:500;text-shadow:0 0 10px rgba(127,218,221,.9)}
.ghost{visibility:hidden}
.cursor{display:inline-block;width:.58em;height:1.08em;vertical-align:-.2em;margin-left:.08em;margin-right:-.66em;background:var(--teal);box-shadow:0 0 14px rgba(26,173,179,.75);animation:blink 1.05s infinite}
html.fast .cursor{background:var(--orange);box-shadow:0 0 14px rgba(255,77,26,.75)}   /* round 13: at 2x the cursor (+ its glow) goes brand orange */
/* v1.15 preview: fixed, non-interactive hint; safe-area aware and outside the copy column */
.tap-hint{--hint-icon:#1AADB3;position:fixed;z-index:4;top:calc(env(safe-area-inset-top,0px) + 11px);right:calc(env(safe-area-inset-right,0px) + 14px);display:flex;align-items:center;gap:6px;color:var(--teal);font-size:12px;line-height:1;letter-spacing:-.02em;white-space:nowrap;opacity:0;transform:translateY(-4px);pointer-events:none;text-shadow:0 0 8px #000;transition:color .25s ease,opacity .7s ease,transform .7s ease}
.tap-hint.ready{opacity:.7;transform:none}
.tap-hint.settled{opacity:.52}
html.fast .tap-hint{--hint-icon:#DD6828;color:var(--orange)}
.tap-hint svg{width:1.35em;height:1.35em;display:block;flex:none;color:var(--hint-icon);transition:color .25s ease}
.tap-hint b{font-weight:500}
@media (prefers-reduced-motion:reduce){.tap-hint{transition:none;transform:none}.tap-hint.ready{opacity:.7}.tap-hint.settled{opacity:.52}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}

.elsewhere{margin-top:30px}
.social{margin-left:-8px;display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;list-style:none}
.social li{opacity:0;transform:scale(.55) translateY(6px);transition:opacity .28s ease-out,transform .38s cubic-bezier(.34,1.56,.64,1)}
.social li.in{opacity:1;transform:none}
.social a{display:flex;align-items:center;justify-content:center;width:42px;height:40px;border-radius:8px}
.social a:hover{background:rgba(26,173,179,.08)}
/* round 14: all 7 icons out front, same orange as the links (no "more +" drawer) */
a:focus-visible,button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.notify input:focus-visible{outline:none}
@media (prefers-reduced-motion:reduce){.notify{transition:none!important}}
.ic{width:28px;height:22px}
/* round 16: the cursor stays after everything renders, blinking at the end of the icon row (teal at 1x, orange at 2x) (jay 2026.09.29) */
.social li.cur{display:flex;align-items:center;height:40px;pointer-events:none}
.social li.cur .cursor{margin:0 0 0 7px;vertical-align:0}
/* round 16: easter egg for people who stay. with the icons (round 23: starts ~250ms before the first one), the quote rains down in orange, one column per letter, and stays (jay 2026.09.29)
   the line is reserved in layout from the start (hidden), so nothing reflows when it lands */
.egg{margin-top:52px;font-size:20px;line-height:1.5;font-weight:400;color:var(--orange);text-shadow:0 0 12px rgba(255,77,26,.6);visibility:hidden}   /* one extra blank line below the icons (same idea as the sign-off gap) */
.egg.on{visibility:visible}
.egg a{color:var(--orange)}
.egg a:hover{color:var(--teal);text-shadow:0 0 12px rgba(26,173,179,.6)}
.egg .w{white-space:nowrap}   /* if it ever has to wrap, it wraps between words */
.egg .c{display:inline-block;position:relative}
.egg .c.fall{color:#ffd9cc;text-shadow:0 0 8px rgba(255,77,26,.95),0 0 20px rgba(255,77,26,.7)}   /* the falling head: hot orange-white, like the rain's white tips */
.egg .tr{position:absolute;left:0;bottom:100%;white-space:pre;line-height:1.25;color:var(--orange);text-shadow:0 0 10px rgba(255,77,26,.55);pointer-events:none;
  -webkit-mask-image:linear-gradient(to top,rgba(0,0,0,.85),rgba(0,0,0,0));mask-image:linear-gradient(to top,rgba(0,0,0,.85),rgba(0,0,0,0));transition:opacity .7s ease-out}
.egg .tr.off{opacity:0}
.egg .c.land{animation:egg-land 1.1s ease-out}
@keyframes egg-land{0%{color:#fff;text-shadow:0 0 10px #fff,0 0 22px rgba(255,77,26,.95)}100%{color:var(--orange);text-shadow:0 0 12px rgba(255,77,26,.6)}}
.egg.fade{animation:egg-fade 1.4s ease-out both}   /* reduced motion: no falling, the line just fades in */
@keyframes egg-fade{from{opacity:0}to{opacity:1}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (max-width:760px){
  /* round 17: tighter vertical rhythm so the whole page (egg included) fits one iphone 17 screen in ios 26 safari (402x718 visible, compact tab bar), no scrolling (jay 2026.09.29).
     was: stage 56/64, paras 20, para gap 16, sig 18, cta 42, icons 24, egg 42. body font + line-height unchanged; the sign-off + egg keep their extra gap */
  .stage{padding:24px 0 22px}
  .copy{margin-left:24px;width:calc(100vw - 48px)}
  .hello{font-size:17px}
  .paras{margin-top:14px}
  .para{font-size:16px;line-height:1.7}
  .para + .para{margin-top:12px}
  .sig{margin-top:15px;font-size:16px}
  .cta{margin-top:32px;font-size:16px}
  .signup{margin-top:4px}
  .notify{gap:14px}
  .notify input{flex:1 1 auto;font-size:16px}
  .notify button{font-size:16px}
  .status{font-size:16px}
  .elsewhere{margin-top:16px}
  .social{margin-left:-9px;gap:0}
  .social a{width:39px;height:40px}
  .ic{width:25px;height:20px}
  .social li.cur{font-size:16px}
  .social li.cur .cursor{margin-left:6px}
  .egg{margin-top:30px;font-size:clamp(12px,calc((100vw - 48px)/25.9),16px)}   /* round 23: 42 chars (with " →") in one line down to 360 wide (13.7px at 402, 13.2px at 390, 12.05px at 360); narrower wraps at a word. was /24.6 for 40 chars */
}

}

/* ---- typing: every line uses the hello line's decode effect ---- */
const seg = typeof Intl !== 'undefined' && Intl.Segmenter ? new Intl.Segmenter('en', {granularity: 'grapheme'}) : null;
const graphemes = t => seg ? Array.from(seg.segment(t), x => x.segment) : Array.from(t);
const cursor = document.createElement('span'); cursor.className = 'cursor';
const mk = (tag, cls) => { const e = document.createElement(tag); if (cls) e.className = cls; return e; };
let pace = 2;   // round 19 (jay 2026.09.29): normal is now the old 2x, a tap doubles it to 4x (orange). was round 12: 1 = normal, 2 = double speed. a tap toggles it (see below); scales every typed line + the pauses between them

/* lays out every piece up front (untyped text is held invisibly), so wrapping is final from the first frame */
const gateTap = el => { el.style.pointerEvents = 'none'; el.tabIndex = -1; el.setAttribute('aria-hidden', 'true'); return el; };
const revealTap = el => { el.style.pointerEvents = ''; el.removeAttribute('tabindex'); el.removeAttribute('aria-hidden'); return el; };
function prepare(el, pieces){
  el.textContent = '';
  const runs = []; let n = 0;
  for (const p of (Array.isArray(pieces) ? pieces : [pieces])){
    const o = typeof p === 'string' ? {text: p} : p;
    if (o.icon){   // round 20: text + an inline icon that counts as one character. the icon is held (invisible, full width) until typing reaches it, scrambles for a beat like a letter, then pops in
      const node = mk('span', 'icon'), res = mk('span', 'res'), scr = mk('span', 'scr'), ghost = mk('span', 'ghost'), box = mk('span', 'icb'), img = mk('img'), iscr = mk('span', 'scr iscr');
      img.src = ICON_SRC[o.icon]; img.alt = o.alt || ''; ghost.textContent = o.text || ''; box.append(img, iscr); node.append(res, scr, ghost, box); el.appendChild(node);
      const g = [...graphemes(o.text || ''), '\ufffc']; runs.push({node, res, scr, ghost, g, start: n, icon: img, iscr, box}); n += g.length; continue;
    }
    const node = mk(o.href ? 'a' : 'span', [o.bold ? 'bold' : '', o.teal ? 'teal' : ''].join(' ').trim());
    if (o.href){ node.setAttribute('href', o.href); gateTap(node); if (/^https?:/.test(o.href)){ node.target = '_blank'; node.rel = 'noopener'; } }
    const res = mk('span', 'res'), scr = mk('span', 'scr'), ghost = mk('span', 'ghost');
    ghost.textContent = o.text; node.append(res, scr, ghost); el.appendChild(node);
    const g = graphemes(o.text); runs.push({node, res, scr, ghost, g, start: n}); n += g.length;
  }
  return {el, runs, n};
}
function render(t, head, win){
  const resolved = Math.max(0, head - win), top = Math.min(head, t.n);
  let active = t.runs[0];
  for (const r of t.runs){
    const L = r.g.length, a = Math.min(L, Math.max(0, resolved - r.start)), b = Math.min(L, Math.max(0, top - r.start));
    if (r.node.tagName === 'A' && resolved >= r.start + L) revealTap(r.node);
    if (r.icon){   // the text part types like any run; the last "character" is the icon
      const T = L - 1, ta = Math.min(a, T), tb = Math.min(b, T);
      r.res.textContent = r.g.slice(0, ta).join(''); r.scr.textContent = r.g.slice(ta, tb).map(c => /\s/.test(c) ? c : rg()).join(''); r.ghost.textContent = r.g.slice(tb, T).join('');
      r.icon.classList.toggle('in', a > T); r.iscr.textContent = b > T && a <= T ? rg() : '';
      if (b > 0) active = r;
      continue;
    }
    r.res.textContent = r.g.slice(0, a).join('');
    r.scr.textContent = r.g.slice(a, b).map(c => /\s/.test(c) ? c : rg()).join('');
    r.ghost.textContent = r.g.slice(b).join('');
    if (b > 0) active = r;
  }
  if (active.icon && top - active.start >= active.g.length) active.node.appendChild(cursor);   // round 20: past the icon, the cursor sits after it
  else active.node.insertBefore(cursor, active.ghost);
}
function type(t, opt){
  const win = opt.window, base = opt.speed, all = t.runs.flatMap(r => r.g);
  let head = 0, cancelled = false;
  const p = new Promise(resolve => {
    const tick = () => {
      if (cancelled) return resolve();
      head++; render(t, head, win); state.head = head;
      if (head - win >= t.n) return resolve();
      const c = all[Math.min(head, t.n) - 1];
      const delay = head > t.n ? base*.7 : c === '.' ? base*3.2 : c === ',' ? base*3 : base*(.75 + Math.random()*.6);
      setTimeout(tick, reduced ? 0 : delay/pace);
    };
    tick();
  });
  p.finish = () => { cancelled = true; render(t, t.n + win, win); };
  return p;
}
const wait = ms => new Promise(r => setTimeout(r, reduced ? 0 : ms/pace));

/* ---- build ---- */
const $ = s => document.querySelector(s);
const parasEl = $('.paras');
const paraLines = (COPY.paragraphs || [COPY.paragraph]).map(pieces => { const p = mk('p', 'para'); p.setAttribute('data-part', ''); parasEl.appendChild(p); return prepare(p, pieces); });
const lines = [prepare($('.hello'), COPY.hello), ...paraLines, prepare($('.sig'), COPY.signoff), prepare($('.prompt'), COPY.cta)];
const LAST = lines.length - 1;
const ninja = mk('img', 'ninja'); ninja.alt = '🥷'; ninja.src = NINJA; $('.sig').appendChild(ninja);
const ul = $('.social');
const iconLink = s => { const a = gateTap(mk('a')); a.setAttribute('href', s.href); a.setAttribute('aria-label', s.label); a.title = s.label;
  if (/^https?:/.test(s.href)){ a.target = '_blank'; a.rel = 'noopener'; }
  a.innerHTML = ICONS[s.icon] || ''; return a; };
COPY.socials.forEach(s => { const li = mk('li'); li.appendChild(iconLink(s)); ul.appendChild(li); });
const curLi = mk('li', 'cur'); curLi.setAttribute('aria-hidden', 'true');   // round 16: the cursor's final home, after the last icon

/* ---- round 16: easter egg (jay 2026.09.29). for people who stay: once the icons are in, the quote rains down slowly in orange,
   one column per letter (a scrambling head + a short fading trail, stepping row by row like the rain), resolves as it lands, and stays.
   laid out up front (hidden) so the landing never reflows; letters start above the viewport, so nothing adds scroll height or width */
const eggEl = $('.egg'), eggText = COPY.egg || '';
const eggChars = [];
let eggW = null;
eggText.split(' ').forEach((word, wi) => {
  if (word === '→' && eggW){   // round 23: the arrow never wraps away from "below"; it still falls as its own letter
    eggW.appendChild(document.createTextNode(' '));
    const c = mk('span', 'c'); c.textContent = word; eggW.appendChild(c); eggChars.push({el: c, ch: word}); return;
  }
  if (wi) eggEl.appendChild(document.createTextNode(' '));   // spaces are just gaps (no falling glyph)
  const w = mk('span', 'w');
  graphemes(word).forEach(ch => { const c = mk('span', 'c'); c.textContent = ch; w.appendChild(c); eggChars.push({el: c, ch}); });
  eggEl.appendChild(w); eggW = w;
});
function eggSettle(){   // the final line: plain text (or a link, if COPY.eggHref is set), readable by screen readers
  eggEl.textContent = '';
  const into = el => {   // round 23: a trailing " →" stays glued to the last word and is decorative (hidden from screen readers)
    const m = eggText.match(/^(.*? )?(\S+) →$/);
    if (!m){ el.textContent = eggText; return; }
    if (m[1]) el.appendChild(document.createTextNode(m[1]));
    const w = mk('span', 'w'); w.textContent = m[2] + ' '; const ar = mk('span'); ar.setAttribute('aria-hidden', 'true'); ar.textContent = '→'; w.appendChild(ar); el.appendChild(w);
  };
  if (COPY.eggHref){ const a = gateTap(mk('a')); a.setAttribute('href', COPY.eggHref); if (/^https?:/.test(COPY.eggHref)){ a.target = '_blank'; a.rel = 'noopener'; } into(a); eggEl.appendChild(a); revealTap(a); }
  else into(eggEl);
  eggEl.removeAttribute('aria-hidden'); state.egg = 'landed';
}
let eggStarted = false;
function egg(){
  if (eggStarted || !eggText) return; eggStarted = true; state.egg = 'falling';
  if (reduced || !eggEl.animate){ eggSettle(); eggEl.classList.add('on', 'fade'); return; }
  const fs = parseFloat(getComputedStyle(eggEl).fontSize), row = fs*1.25, [s0, s1] = TIMING.eggStep;
  let left = eggChars.length, last = 0;
  const t0 = performance.now();
  for (const c of eggChars){
    const top = c.el.getBoundingClientRect().top;
    const rows = Math.max(8, Math.ceil((top + row*2)/row));   // start just above the viewport, drop row by row into the slot
    const dur = Math.min(4600, Math.max(3000, rows*(s0 + Math.random()*(s1 - s0))));
    const delay = Math.random()*Math.max(0, TIMING.eggTotal - dur);
    last = Math.max(last, delay + dur);
    const tr = mk('span', 'tr'); c.trail = Array.from({length: 4 + Math.floor(Math.random()*4)}, rg); tr.textContent = c.trail.join('\n');
    c.tr = tr; c.el.appendChild(tr); c.el.firstChild.textContent = rg(); c.el.classList.add('fall');
    c.end = t0 + delay + dur;
    const an = c.el.animate([{transform: `translateY(${-rows*row}px)`}, {transform: 'translateY(0)'}], {duration: dur, delay, easing: `steps(${rows}, end)`, fill: 'backwards'});
    an.finished.then(() => {
      c.done = true; c.el.firstChild.textContent = c.ch; c.el.classList.remove('fall'); c.el.classList.add('land');
      tr.classList.add('off'); setTimeout(() => tr.remove(), 750);
      if (--left === 0){ clearInterval(scr); setTimeout(eggSettle, 1200); }
    });
  }
  state.eggMs = Math.round(last);
  eggEl.classList.add('on');
  const scr = setInterval(() => {   // scramble: heads flicker, trails shift like the rain columns; the real letter shows just before it lands
    const now = performance.now();
    for (const c of eggChars){
      if (c.done) continue;
      c.el.firstChild.textContent = c.end - now < 260 ? c.ch : Math.random() < .7 ? rg() : c.el.firstChild.textContent;
      c.trail.pop(); c.trail.unshift(rg()); c.tr.textContent = c.trail.join('\n');
    }
  }, 90);
}

/* ---- signup (round 10): progressive enhancement. no js = a normal form post */
const form = $('.notify'), statusEl = $('.status'), formTaps = [...form.querySelectorAll('input, button')];
formTaps.forEach(gateTap);
const showForm = () => { form.classList.add('in'); setTimeout(() => formTaps.forEach(revealTap), reduced ? 0 : 500); };
form.addEventListener('submit', async e => {
  e.preventDefault();
  const btn = form.querySelector('button'); btn.disabled = true;
  try { await fetch(form.action, {method: 'POST', mode: 'no-cors', body: new FormData(form)}); }
  catch (err) { btn.disabled = false; form.submit(); return; }
  form.inert = true; form.classList.add('gone');
  statusEl.innerHTML = '<span class="sr"></span><span class="typed" aria-hidden="true"></span>';
  statusEl.firstChild.textContent = COPY.thanks;
  const t = prepare(statusEl.lastChild, COPY.thanks); render(t, 0, TIMING.window);
  statusEl.tabIndex = -1; statusEl.style.outline = 'none'; statusEl.focus({preventScroll: true});
  await wait(180); await type(t, {speed: TIMING.paraSpeed, window: TIMING.window});
});
const state = window.__intro = {line: -1, para: -1, head: 0, icons: 0, done: false};   // line: 0 hello, 1 paragraphs, 2 sign-off, 3 icons
const hint = $('.tap-hint'), hintSpeed = hint.querySelector('b');
const setHintMode = fast => { hintSpeed.textContent = fast ? '1x' : '2x'; };

const T = [26,173,179], PALE_TEAL = [121,205,207], W = [214,222,222], HEAD = [255,255,255];
const RAIN_ORANGE = [221,104,40];   // #DD6828: muted orange, OKLab L=.649 C=.164, ΔE OKLab vs teal=.271 (current #D1723C=.243); below egg #FF4D1A C=.222
const PALE_ORANGE = [234,170,132];  // #EAAA84: family tint for the former W drops; same strength, with pale peach tips
// The live W is retained only as a comparison reference; new preview palettes are teal-family in normal and orange-family in fast mode.
const mob = () => document.documentElement.clientWidth < 760;
const rain = Rain(document.getElementById('rain'), {
  fs: 16, fsMobile: 13, mono: '"JetBrains Mono", monospace', seed: 5, head: HEAD, headMix: .6,
  palette: (x, w, r) => r < .84 ? T : PALE_TEAL,
  bands: (w, H) => [{y0: 0, y1: H, perCol: mob() ? 1.6 : 2.1, lenMin: 8, lenMax: 30, alpha: .56, stepMin: 60, stepMax: 170,
      colDensity: () => 1}],   // same amount of rain across the full width (jay, round 6)
  alphaAt: (x, y, R) => 1 - .45*smooth(R.H*.55, R.H, y),
  // no parting: rain runs behind the text. over the text block it's dimmed to 30% (tips included), feathered over 50px, so there's no box edge
  partSel: '.copy', partPad: 50, partFloor: .75,   // round 28 preview: rain over the text at 75% (was .3)
  tint: T, paleTint: PALE_TEAL, paleOrange: PALE_ORANGE   // both teal-family entries follow the typing speed
});

let current = null, skipped = false;
function popIcons(instant){
  const done = () => {   // round 16: the cursor comes back for good at the end of the icon row. round 23: the egg is already raining by now (egg() is a no-op here; reduced motion: it fades in here)
    curLi.appendChild(cursor); ul.appendChild(curLi); curLi.classList.add('in'); state.done = true; hint.classList.add('ready'); egg();
  };
  const icons = [...ul.children].filter(li => li !== curLi);
  icons.forEach((li, i) => {
    const a = li.querySelector('a');
    if (instant){ li.classList.add('in'); revealTap(a); state.icons = i + 1; return; }
    setTimeout(() => { li.classList.add('in'); setTimeout(() => revealTap(a), 300); state.icons = i + 1; if (i === icons.length - 1) setTimeout(done, 400); }, i*TIMING.iconStagger);
  });
  if (instant) done();
}
async function intro(){
  document.body.classList.add('typing');
  await wait(450);
  for (let i=0;i<lines.length;i++){
    if (skipped) return;
    state.line = i === 0 ? 0 : i === LAST ? 2 : 1; state.para = i === 0 ? -1 : i - 1; state.head = 0;
    current = type(lines[i], {speed: i === 0 ? TIMING.helloSpeed : TIMING.paraSpeed, window: TIMING.window}); await current;
    if (skipped) return;
    if (i === LAST){
      document.body.classList.remove('typing'); cursor.remove(); showForm();
      const toIcons = (520 + TIMING.beforeIcons)/pace;   // round 23: the first icon pops in this many ms from now; start the egg rain TIMING.eggLead before it
      setTimeout(egg, Math.max(0, toIcons - TIMING.eggLead));
      await wait(520);
    }
    if (i === LAST - 1){ cursor.remove(); ninja.classList.add('in'); await wait(420); }
    const ended = lines[i].runs.flatMap(r => r.g).join('').trimEnd();
    await wait(i === 0 ? TIMING.afterHello : i === LAST ? TIMING.beforeIcons : i === LAST - 1 ? TIMING.beforeSignoff : ended.endsWith('...') ? TIMING.afterEllipsis : TIMING.betweenParas);
  }
  state.line = 3; popIcons(false);
}
function skip(){
  if (skipped || state.line >= 3) return;
  skipped = true; current && current.finish();
  lines.forEach(t => render(t, t.n + TIMING.window, TIMING.window));
  cursor.remove(); showForm();
  ninja.classList.add('in'); document.body.classList.remove('typing'); state.line = 3; popIcons(true);
}
/* round 8: no skip. the full intro always types out (reduced-motion users still get the finished page) */
/* round 12: each tap/click toggles typing speed 1x <-> 2x. a tap = press + release within 10px, so scrolls, drags + text selection don't count.
   links, buttons + the email input never toggle and keep working as usual. the rain keeps its own speed */
let down = null;
document.addEventListener('pointerdown', e => { down = e.isPrimary && e.button === 0 && !e.target.closest('a, button, input, label') ? {x: e.clientX, y: e.clientY} : null; });
document.addEventListener('pointercancel', () => { down = null; });
document.addEventListener('pointerup', e => {
  if (!down || !e.isPrimary || Math.hypot(e.clientX - down.x, e.clientY - down.y) > 10 || String(getSelection())) return;
  down = null; pace = pace === 2 ? 4 : 2; state.pace = pace;
  document.documentElement.classList.toggle('fast', pace === 4);   // round 13: orange cursor while at 2x
  setHintMode(pace === 4); hint.classList.add('settled');
  rain.setSpeed(pace === 4 ? 2 : 1, 250);
  rain.setTint(pace === 4 ? RAIN_ORANGE : T, 250);   // round 25 (preview): teal rain eases to orange (and back) over ~250ms
});

lines.forEach(t => render(t, 0, TIMING.window));   // reserve the final layout, nothing visible yet
cursor.remove();
lines[0].runs[0].node.insertBefore(cursor, lines[0].runs[0].ghost);
document.fonts.ready.then(() => { rain.build(); requestAnimationFrame(rain.frame); if (reduced){ skip(); } else intro(); });
let lastW = innerWidth, rt; addEventListener('resize', () => { if (innerWidth === lastW) return; lastW = innerWidth; clearTimeout(rt); rt = setTimeout(rain.build, 150); });
})();
</script>
</body>
</html>
