:root{
  --bg:#000; --ink:#f6efe9; --ink-2:rgba(246,239,233,.72); --ink-3:rgba(246,239,233,.5);
  --orange:#FF4D1A; --teal:#1AADB3; --white:#fff;
  --mono:"JetBrains Mono","IBM Plex Mono",ui-monospace,monospace;
  --left:max(64px,calc((100vw - 1312px)/2));
}
*{box-sizing:border-box;margin:0;padding:0;font-style:normal}
html{background:var(--bg);touch-action:manipulation}   /* round 12: taps toggle typing speed, so no double-tap zoom (pinch zoom + scrolling still work). jay 2026.09.30 v1.25: during the intro a tap is the terminal dump; after it, the 1x/2x rain toggle */
body{background:var(--bg);color:var(--ink);font-family:var(--mono);font-weight:500;-webkit-font-smoothing:antialiased;overflow-x:hidden;position:relative;min-height:100vh;min-height:100svh}   /* round 17: svh = the visible area between safari's bars, so a page that fits never scrolls */
a{color:var(--orange);text-decoration:none;transition:color .15s ease}
a:hover{color:var(--teal)}
::selection{background:var(--teal);color:#021213}
.glows{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 20%,#000 80%,transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 20%,#000 80%,transparent 100%)}   /* round 8: glow fades out so the top + bottom are pure #000 (blends into oled black) */
.glow{position:absolute;border-radius:50%;filter:blur(14px)}
/* round 24 (jay 2026.09.29): orange text (egg line + its falling letters/trails/arrow, "[ count me in ]", round 27 (jay 2026.09.30): was "[ notify me ]") is regular 400; teal + white stay 500 */
#rain{position:absolute;left:0;top:0;width:100%;z-index:1;pointer-events:none}
.scan{position:fixed;inset:0;z-index:30;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(235,250,250,.026) 0 1px,rgba(0,0,0,0) 1px 3px);mix-blend-mode:screen;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 20%,#000 80%,transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 20%,#000 80%,transparent 100%)}

.stage{position:relative;z-index:2;min-height:100vh;min-height:100svh;display:flex;align-items:center;padding:clamp(48px,8vh,96px) 0 clamp(56px,9vh,100px)}   /* centered; if the block is taller than the viewport the stage just grows (no clipping) */
.copy{margin-left:var(--left);width:min(60ch,calc(100vw - 48px));font-size:20px;text-shadow:0 0 8px rgba(0,0,0,.8)}
.hello{font-size:21px;line-height:1.4;color:var(--teal)}
.paras{margin-top:26px}
.para{font-size:20px;line-height:1.7;color:var(--white);white-space:pre-line}
.para + .para{margin-top:20px}
@media (min-width:761px){.copy{width:min(70ch,calc(100vw - var(--left) - 24px))}}   /* round 23 (jay 2026.09.29): desktop column wide enough for the longest paragraph */
/* v1.42 (jay 2026.10.02): retired with the old copy: @media (min-width:940px){.para{white-space:nowrap}} (every paragraph on one line). the new paragraphs are longer than the column, so they wrap at every width */
.para a{white-space:nowrap}   /* an address/link never breaks mid-way; lines wrap at the "; " separators */
.para .bold{font-weight:700;color:var(--white)}
.para .teal{color:var(--teal)}
.sig{margin-top:22px;font-size:20px;line-height:1.5;color:var(--teal)}
.sig .ninja{display:inline-block;height:1.45em;width:1.45em;margin-left:.08em;vertical-align:-.38em;opacity:0;transform:scale(.4) translateY(6px);transition:opacity .28s ease-out,transform .42s cubic-bezier(.34,1.56,.64,1)}
.sig .ninja.in{opacity:1;transform:none}
.cta{margin-top:52px;font-size:20px;line-height:1.5}   /* jay 2026.09.29: one extra blank line after the sign-off */
.prompt{color:var(--white);line-height:1.7}   /* v1.42: the invitation is a full paragraph now, so it wraps with the paragraphs' line spacing (was the .cta's 1.5) */
/* v1.39 (jay 2026.10.01): right after the sign-off, the prompt + everything below rains in together (see bottomRain). the prompt's letters fall like the egg's (white heads, white land glow
   settling to its normal shadow); the email field, rocket and "touch it" each get one column (.col) that lands on them, and they appear + work as it lands */
.prompt .w{white-space:nowrap}.prompt .c{display:inline-block;position:relative}
.prompt .c.fall{color:#fff;text-shadow:0 0 8px #fff,0 0 20px rgba(255,255,255,.65)}
.prompt .tr{color:rgba(255,255,255,.72);text-shadow:0 0 10px rgba(255,255,255,.4)}
.prompt .c.land{animation:prompt-land 1.1s ease-out}
@keyframes prompt-land{0%{text-shadow:0 0 10px #fff,0 0 22px rgba(255,255,255,.95)}100%{text-shadow:0 0 8px rgba(0,0,0,.8)}}
.signup{position:relative}
.signup .col{position:absolute;left:0;top:0;margin:-.625em 0 0 -.3em;line-height:1.25;white-space:pre;pointer-events:none;z-index:2;color:#ffd9cc;text-shadow:0 0 8px rgba(255,77,26,.95),0 0 20px rgba(255,77,26,.7)}
.signup .col.teal{color:#d2f6f7;text-shadow:0 0 8px rgba(26,173,179,.95),0 0 20px rgba(26,173,179,.7)}
.signup .col.teal .tr{color:var(--teal);text-shadow:0 0 10px rgba(26,173,179,.55)}
.js .notify.rainin{transition:none}
.notify.rainin > input[type=email]:not(.landed),.notify.rainin > .rkb:not(.landed){visibility:hidden}
.notify.rainin > input[type=email].landed:not(.now){animation:in-land 1.1s ease-out}
@keyframes in-land{0%{border-bottom-color:#fff;box-shadow:0 1px 0 #fff,0 10px 22px -8px rgba(26,173,179,1)}100%{box-shadow:0 0 0 rgba(26,173,179,0)}}
.notify.rainin > .rkb.landed:not(.now){animation:rk-land 1.1s ease-out}
@keyframes rk-land{0%{filter:drop-shadow(0 0 6px #fff) drop-shadow(0 0 14px rgba(255,77,26,.95))}100%{filter:drop-shadow(0 0 0 rgba(255,77,26,0))}}
/* round 10: inline signup. prompt types, then the form slides in; the thank-you line types into the same slot (no reflow) */
.signup{display:grid;grid-template-columns:minmax(0,1fr);margin-top:6px}
.signup > *{grid-area:1/1}
.notify{display:flex;min-width:0;align-items:baseline;gap:18px;transition:opacity .45s ease-out,transform .5s cubic-bezier(.22,1,.36,1),visibility 0s}
.js .notify{opacity:0;transform:translateY(6px);visibility:hidden}
.js .notify.in{opacity:1;transform:none;visibility:visible}
.js .notify.gone{opacity:0;transform:translateY(-4px);visibility:hidden;transition:opacity .2s ease-in,transform .2s ease-in,visibility 0s .2s}
.notify input{flex:0 1 23ch;min-width:0;font:inherit;font-size:18px;line-height:1.5;color:var(--white);background:transparent;border:0;border-bottom:1px solid rgba(26,173,179,.55);border-radius:0;padding:4px 0 5px;caret-color:var(--teal);outline:none;-webkit-appearance:none;appearance:none;transition:border-color .2s ease,box-shadow .2s ease}
.notify input::placeholder{color:rgba(246,239,233,.34);opacity:1}
/* v1.31 PREVIEW (jay 2026.09.30): no browser validation bubble (the form is novalidate). a failed liftoff makes the placeholder "you@email.com" (or the partial email typed)
   glow + pulse in brand teal instead (failGlow sets these three custom properties per frame). colour + text-shadow only, so nothing ever moves */
.notify input{color:var(--eg-c,var(--white));text-shadow:var(--eg-s,none)}
.notify input::placeholder{color:var(--eg-pc,rgba(246,239,233,.34));text-shadow:var(--eg-s,none)}
.notify input:hover{border-bottom-color:rgba(26,173,179,.8)}

   it's in the form row from the first paint (hidden), so turning it on moves nothing; it goes with the form on a real liftoff. phones: the email field is narrower

/* ---- typing: every line uses the hello line's decode effect ---- */
const seg = typeof Intl !== 'undefined' && Intl.Segmenter ? new Intl.Segmenter('en', {granularity: 'grapheme'}) : null;

/* lays out every piece up front (untyped text is held invisibly), so wrapping is final from the first frame */
const gateTap = el => { el.style.pointerEvents = 'none'; el.tabIndex = -1; el.setAttribute('aria-hidden', 'true'); return el; };
const revealTap = el => { el.style.pointerEvents = ''; el.removeAttribute('tabindex'); el.removeAttribute('aria-hidden'); return el; };
function prepare(el, pieces){
  el.textContent = '';
  const runs = []; let n = 0;
  for (const p of (Array.isArray(pieces) ? pieces : [pieces])){
    const o = typeof p === 'string' ? {text: p} : p;
    const node = mk(o.href ? 'a' : 'span', [o.bold ? 'bold' : '', o.teal ? 'teal' : ''].join(' ').trim());
    if (o.href){ node.setAttribute('href', o.href); gateTap(node); if (/^https?:/.test(o.href)){ node.target = '_blank'; node.rel = 'noopener'; } }

  }

    for (let h = (j === lineAt ? state.head : 0) + 1; h <= t.n + win; h++) tape.push(() => render(t, h, win));
    if (j === LAST - 1) tape.push(() => { ninja.classList.add('in'); cursorSig(); });
    if (j === LAST) tape.push(() => { document.body.classList.remove('typing'); cursorSig(); if (!form.classList.contains('in')) showForm(); });   // v1.30: after the icons the cursor is already home; leave it
  }
  icons.forEach(li => { if (li.classList.contains('in')) return; const a = li.querySelector('a');
    tape.push(() => { li.classList.add('in'); setTimeout(() => revealTap(a), 300); }, () => {}); });
  const scrambling = new Set(), eggLeft = [];
  if (eggText && state.egg !== 'landed'){
    eggStop(); state.egg = 'dumping';
    for (const c of eggChars) if (!c.done){ c.el.style.visibility = 'hidden'; eggLeft.push(c); }
    eggEl.classList.add('on');
    const W = DUMP.eggWindow, land = c => { scrambling.delete(c); c.el.firstChild.textContent = c.ch; c.el.classList.remove('fall'); };
    for (let k = 0; k < eggLeft.length + W; k++) tape.push(() => {
      const c = eggLeft[k]; if (c){ c.el.style.visibility = ''; c.el.classList.add('fall'); scrambling.add(c); }
      if (k - W >= 0) land(eggLeft[k - W]);
    });
  }
  const total = tape.length, D = Math.min(DUMP.ms, total*DUMP.perStep), t0 = performance.now();
  let at = 0;
  state.dump = {steps: total, ms: Math.round(D), t0, from: {line: lineAt, head: state.head}};
  const frame = now => {
    const k = Math.min(total, Math.ceil((now - t0)/D*total));
    while (at < k) tape[at++]();
    for (const c of scrambling) c.el.firstChild.textContent = rg();
    if (at < total){ dumpRaf = requestAnimationFrame(frame); return; }
    dumpRaf = 0; dumping = false; state.dump.took = Math.round(performance.now() - t0); unboost(DUMP.rainDown);   // v1.33: landed, so the rain eases back to the orange 2x
    state.line = 3; state.icons = icons.length;
    if (eggText && state.egg === 'dumping') eggSettle();
    finishUp();
  };
  dumpRaf = requestAnimationFrame(frame);
}

/* jay 2026.09.30 v1.25: back navigation shows the page fully loaded. the rule: this tab has already shown the homepage (sessionStorage "jtn.home", set when the
   intro finishes and whenever the homepage is left), AND this load is a back/forward navigation or came from the "← jaytha.ninja" link on /song-of-the-day/ or /quote-of-the-day/
   (a one-shot "jtn.back" note that rain.js leaves there). a new tab, a new visit, or a reload still types the full intro. a bfcache restore (pageshow persisted)
   finishes whatever was left at once, even mid-intro or mid-dump */
const store = (() => { try { return window.sessionStorage; } catch (e) { return null; } })();
const ssGet = k => { try { return store && store.getItem(k); } catch (e) { return null; } };
const markSeen = () => { try { store && store.setItem('jtn.home', '1'); } catch (e) {} };
const navType = ((performance.getEntriesByType && performance.getEntriesByType('navigation')[0]) || {}).type || '';
const fromLink = ssGet('jtn.back') === '1'; try { store && store.removeItem('jtn.back'); } catch (e) {}
const cameBack = ssGet('jtn.home') === '1' && (navType === 'back_forward' || fromLink);
state.nav = navType; state.instant = cameBack;
addEventListener('pagehide', markSeen);
addEventListener('pageshow', e => { if (e.persisted && !(state.done && (state.egg === 'landed' || !eggText))) complete(); });

/* v1.26: today's quote = what /quote-of-the-day/ shows at the top: the newest quotes.json entry dated today or earlier (america/chicago; same rule as quote-of-the-day/index.html).
   the egg is laid out from the start with the quote this tab saw last today (sessionStorage "jtn.quote"), else COPY.egg; the fetch swaps in the real one
   (before the rain starts it's invisible; after it landed it just refits). if quotes.json can't be read, the line stays COPY.egg */
const chiDay = () => new Intl.DateTimeFormat('en-CA', {timeZone: 'America/Chicago', year: 'numeric', month: '2-digit', day: '2-digit'}).format(new Date());
function applyQuote(q, src){
  const body = lc(q); state.quote = {src, text: body || quoteLine.body};
  if (!body || body === quoteLine.body) return;
  quoteLine.body = body;
  if (!state.egg) buildEgg(); else if (state.egg === 'landed') eggSettle();   // falling / dumping: eggSettle picks it up as it lands
}
try { const c = JSON.parse(ssGet('jtn.quote') || 'null'); if (c && c.day === chiDay() && c.quote) applyQuote(c.quote, 'session'); } catch (e) {}
if (!state.quote) state.quote = {src: 'fallback', text: quoteLine.body};
buildEgg();
fetch(COPY.eggData, {cache: 'no-cache'}).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(all => {
  const day = chiDay();
  const top = (Array.isArray(all) ? all : []).filter(e => e && /^\d{4}-\d{2}-\d{2}$/.test(e.date) && e.quote && e.date <= day).sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : 0)[0];
  if (!top) return;
  try { store && store.setItem('jtn.quote', JSON.stringify({day, quote: top.quote})); } catch (e) {}
  applyQuote(top.quote, 'quotes.json');
}).catch(() => { state.quoteError = true; });
/* v1.42 (jay 2026.10.02): today's recap = the newest recaps.json entry, only if it is dated today or yesterday (america/chicago: jay writes it at night, the 5am drop publishes it the next morning). lowercase, one line, cut with "… →" like the others (fitEgg).
   no entry for today = no line. the egg is laid out before anything shows: the intro waits for this fetch (at most TIMING.recapWait), and this tab's last answer for today
   (sessionStorage "jtn.recap") is used from the first paint, so the line never pops in under the rest */
function applyRecap(text, src){
  const body = lc(text); state.recap = {src, text: body};
  if (body === recapLine.body) return;
  recapLine.body = body;
  if (!state.egg) buildEgg(); else if (state.egg === 'landed') eggSettle();
}
try { const c = JSON.parse(ssGet('jtn.recap') || 'null'); if (c && c.day === chiDay()) applyRecap(c.text || '', 'session'); } catch (e) {}
const recapReady = fetch(COPY.recapData, {cache: 'no-cache'}).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(all => {
  const day = chiDay();
  const top = (Array.isArray(all) ? all : []).filter(e => e && /^\d{4}-\d{2}-\d{2}$/.test(e.date) && typeof e.text === 'string' && e.text.trim() && e.date <= day).sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : 0)[0];
  const y = new Date(day + 'T12:00:00Z'); y.setUTCDate(y.getUTCDate() - 1); const yesterday = y.toISOString().slice(0, 10);   // the chicago day before (noon UTC, so no DST edge)
  const text = top && (top.date === day || top.date === yesterday) ? top.text : '';
  try { store && store.setItem('jtn.recap', JSON.stringify({day, text})); } catch (e) {}
  applyRecap(text, 'recaps.json');
}).catch(() => { state.recapError = true; });

lines.forEach(t => render(t, 0, TIMING.window));   // reserve the final layout, nothing visible yet
cursor.remove();
lines[0].runs[0].node.insertBefore(cursor, lines[0].runs[0].ghost);
if (cameBack) complete();   // v1.25: fully loaded from the very first paint
Promise.all([document.fonts.ready, Promise.race([recapReady, new Promise(r => setTimeout(r, TIMING.recapWait))])]).then(() => { fitEgg(true);   // v1.42: + the recap fetch (capped), so the egg's line count is final before anything shows
  rain.build(); requestAnimationFrame(rain.frame); if (cameBack) return; if (reduced){ skip(); } else intro(); });
let lastW = innerWidth, rt; addEventListener('resize', () => { if (innerWidth === lastW) return; lastW = innerWidth; clearTimeout(rt); rt = setTimeout(() => { fitEgg(); rain.build(); }, 150); });
addEventListener('orientationchange', () => setTimeout(() => fitEgg(), 250));   // v1.26: the egg refits on rotation too (fitEgg skips if the column width didn't change)
if (window.ResizeObserver){ let ro; new ResizeObserver(() => { clearTimeout(ro); ro = setTimeout(() => fitEgg(), 120); }).observe(eggEl); }   // ...and whenever the column width changes for any other reason
})();
</script>
</body>
</html>
